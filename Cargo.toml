[workspace]
resolver = "3"
members = [
  "exwlshellev",
  "iced_exwlshell",
  "iced_exwlshell_macros",
  "iced_wayland_subscriber",
  "waycrate_xkbkeycode",
  "iced_exdevtools",
  "iced_examples/*",
]

[workspace.package]
authors = [
  "Decodertalkers <aakari@tutanota.com>",
  "Aakash Sen Sharma <aakashsensharma@gmail.com>",
]
edition = "2024"
version = "0.20.0"
license = "MIT"
repository = "https://github.com/waycrate/exwlshelleventloop"
description = "Wayland extra shell lib"
keywords = ["wayland", "wlroots"]
readme = "README.md"

[workspace.dependencies]
exwlshellev = { version = "0.20.0", path = "./exwlshellev" }
iced_wayland_subscriber = { version = "0.20.0", path = "./iced_wayland_subscriber" }
iced_exdevtools = { version = "0.20.0", path = "./iced_exdevtools" }
iced_exwlshell = { version = "0.20.0", path = "./iced_exwlshell" }
iced_exwlshell_macros = { version = "0.20.0", path = "./iced_exwlshell_macros" }
waycrate_xkbkeycode = { version = "0.20.0", path = "./waycrate_xkbkeycode" }

tempfile = "3.27.0"
thiserror = "2.0.20"
wayland-client = { version = "0.31.15" }

wayland-protocols = { version = "0.32.13", default-features = false, features = [
  "unstable",
  "staging",
  "client",
] }

tracing-subscriber = { version = "0.3.23", features = ["std", "env-filter"] }

wayland-cursor = "0.31.14"

wayland-protocols-wlr = { version = "0.3.12", default-features = false, features = [
  "client",
] }

wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-backend = { version = "0.3.17", features = ["client_system"] }
rustix = { version = "1.1.4", features = ["event"] }

calloop = "0.14.4"
calloop-wayland-source = "0.4.1"

rwh_06 = { package = "raw-window-handle", version = "0.6", features = ["std"] }
sctk = { package = "smithay-client-toolkit", version = "0.21.1" }
iced = "0.15.0-dev"
iced_runtime = "0.15.0-dev"
iced_core = "0.15.0-dev"
iced_program = "0.15.0-dev"
iced_renderer = "0.15.0-dev"
iced_futures = "0.15.0-dev"
iced_graphics = "0.15.0-dev"
iced_debug = "0.15.0-dev"
iced_devtools = "0.15.0-dev"
iced_widget = "0.15.0-dev"
window_clipboard = "0.5.1"

log = "0.4"
enumflags2 = "0.7"

xkbcommon-dl = "0.4.2"
memmap2 = "0.9.11"
winit-common = { version = "0.31.0-beta.2", features = ["xkb", "wayland"] }
winit-core = "0.31.0-beta.2"                                                # Has some important types

tracing = "0.1"
futures = "0.3"

darling = { version = "0.24.1", features = ["suggestions"] }
manyhow = { version = "0.13.0", features = ["darling"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0", features = ["full"] }


[patch.crates-io]
iced = { git = "https://github.com/acul009/iced.git" }
iced_runtime = { git = "https://github.com/acul009/iced.git" }
iced_core = { git = "https://github.com/acul009/iced.git" }
iced_program = { git = "https://github.com/acul009/iced.git" }
iced_renderer = { git = "https://github.com/acul009/iced.git" }
iced_futures = { git = "https://github.com/acul009/iced.git" }
iced_graphics = { git = "https://github.com/acul009/iced.git" }
iced_debug = { git = "https://github.com/acul009/iced.git" }
iced_devtools = { git = "https://github.com/acul009/iced.git" }
iced_widget = { git = "https://github.com/acul009/iced.git" }
